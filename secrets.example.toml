# secrets.example.toml
#
# Copy this file to .streamlit/secrets.toml and fill in your values.
# .streamlit/secrets.toml is gitignored — never commit real credentials.
#
# On Streamlit Community Cloud, paste these values into:
#   App Settings → Secrets (TOML format)
#
# Setup guide: see "Google Sheets Setup" in README.md

# ── Google Service Account ─────────────────────────────────────────────────
# Paste the full contents of your service account JSON key here.
# The private_key must have actual newlines replaced with \n.

[gcp_service_account]
type                        = "service_account"
project_id                  = "your-project-id"
private_key_id              = "abc123..."
private_key                 = "-----BEGIN RSA PRIVATE KEY-----\nMIIE...\n-----END RSA PRIVATE KEY-----\n"
client_email                = "poll-writer@your-project-id.iam.gserviceaccount.com"
client_id                   = "123456789"
auth_uri                    = "https://accounts.google.com/o/oauth2/auth"
token_uri                   = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url        = "https://www.googleapis.com/robot/v1/metadata/x509/poll-writer%40your-project-id.iam.gserviceaccount.com"

# ── Google Sheet config ────────────────────────────────────────────────────
# The exact name of your Google Sheet (must be shared with client_email above)

[google_sheets]
spreadsheet_name = "Principles in Chaos — Poll Responses"
